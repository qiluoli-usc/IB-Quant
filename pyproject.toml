[project]
name = "ib-quant"
version = "0.1.0"
description = "Personal IBKR minute-level monitoring and trading framework."
requires-python = ">=3.12"
dependencies = [
  "ib_async>=2.1.0",
  "yfinance>=0.2",
  "pandas>=2.0",
  "pyarrow>=15",
  "PyYAML>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
